# Shared evaluator environment; uses the same coherent Conda CUDA 12.4 pair as
# the modern baseline environments and never mixes it with pip torch wheels.
name: dlb-eval
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pip=24.2
  - pytorch=2.5.1
  - mkl<2024.1
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4
  - pip:
      - accelerate==1.2.1
      - datasets==3.6.0
      - evaluate==0.4.2
      - fsspec==2025.3.0
      - huggingface-hub==0.36.0
      - mauve-text==0.3.0
      - numpy==2.3.2
      - pydantic==2.12.4
      - pyyaml==6.0.2
      - sacrebleu==2.5.1
      - scipy==1.16.3
      - tokenizers==0.22.1
      - transformers==4.57.3
