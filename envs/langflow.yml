# Upstream specifies Python 3.12 and a cu124 wheel.  The equivalent Conda
# pytorch/pytorch-cuda pair keeps all torch packages in one solver strategy.
name: dlb-langflow
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.12
  - pip=24.2
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4
  - pip:
      - einops==0.8.1
      - huggingface-hub==0.36.0
      - safetensors==0.5.3
      - transformers==4.57.3
