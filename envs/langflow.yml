# Upstream specifies Python 3.12 and a cu124 wheel.  The equivalent Conda
# pytorch/pytorch-cuda pair keeps all torch packages in one solver strategy.
name: dlb-langflow
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.12
  - pip=24.2
  - pytorch=2.5.1
  - mkl<2024.1
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4
  - pip:
      - datasets==3.6.0
      - einops==0.8.1
      - fsspec==2025.3.0
      - huggingface-hub==0.36.0
      - pyarrow==20.0.0
      - pydantic==2.12.4
      - pyyaml==6.0.2
      - safetensors==0.5.3
      - transformers==4.57.3
