# The upstream CUDA 12.1 runtime is upgraded to the target CUDA 12.4 solver
# pair. FlashAttention remains a post-torch build in create_all.sh.
name: dlb-mdlm
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.9
  - pip=24.2
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - cuda-toolkit=12.4
  - pip:
      - causal-conv1d==1.1.3.post1
      - datasets==2.18.0
      - einops==0.7.0
      - fsspec==2024.2.0
      - h5py==3.10.0
      - hydra-core==1.3.2
      - lightning==2.2.1
      - mamba-ssm==1.1.4
      - nvitop==1.3.2
      - omegaconf==2.3.0
      - pandas==2.2.1
      - rich==13.7.1
      - timm==0.9.16
      - transformers==4.38.2
      - wandb==0.13.5
