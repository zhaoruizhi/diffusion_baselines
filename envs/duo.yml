# Duo's torch 2.3.1 pin predates the project's CUDA 12.4 target.  This uses a
# coherent CUDA 12.4 PyTorch pair; create_all.sh retains Duo's FA 2.7.4.post1.
name: dlb-duo
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.12
  - pip=24.2
  - pytorch=2.5.1
  - mkl<2024.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - cuda-toolkit=12.4
  - pip:
      - datasets==2.15.0
      - einops==0.7.0
      - fsspec==2023.10.0
      - h5py==3.10.0
      - hydra-core==1.3.2
      - lightning==2.2.1
      - nvitop==1.3.2
      - omegaconf==2.3.0
      - pandas==2.2.1
      - pydantic==2.12.4
      - pyyaml==6.0.2
      - rich==13.7.1
      - scikit-learn==1.4.0
      - timm==0.9.16
      - torchmetrics==1.6.1
      - tqdm==4.66.2
      - transformers==4.38.2
      - wandb==0.18.7
