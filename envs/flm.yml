# Linux/NVIDIA CUDA 12.4 server environment. FlashAttention is installed by
# create_all.sh after PyTorch so its build can discover the selected torch ABI.
name: dlb-flm
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pip=24.2
  - pytorch=2.5.1
  - mkl<2024.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - cuda-toolkit=12.4
  - pip:
      - datasets==3.6.0
      - einops==0.8.1
      - entmax==1.3
      - fsspec==2025.3.0
      - huggingface_hub==0.36.0
      - hf_transfer==0.1.9
      - hydra-core==1.3.2
      - lightning==2.6.0
      - numpy==2.3.2
      - omegaconf==2.3.0
      - rich==14.2.0
      - scipy==1.16.3
      - timm==1.0.22
      - tokenizers==0.22.1
      - torchmetrics==1.8.2
      - transformers==4.57.3
      - wandb==0.23.1
