# This is the Di4C language/SDTT subproject, not the obsolete MaskGIT image
# environment. It uses the stable CUDA 12.4 SDTT dependency set.
name: dlb-di4c
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.10
  - pip=24.2
  - pytorch=2.5.1
  - mkl<2024.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - cuda-toolkit=12.4
  - pip:
      - datasets==2.18.0
      - einops==0.7.0
      - evaluate==0.4.2
      - fancy-einsum==0.0.3
      - fsspec==2024.2.0
      - gpustat==1.1.1
      - huggingface-hub==0.21.1
      - hydra-core==1.3.2
      - hydra-submitit-launcher==1.2.0
      - lightning==2.2.1
      - loguru==0.7.2
      - mauve-text==0.3.0
      - omegaconf==2.3.0
      - pandas==2.2.1
      - safetensors==0.4.2
      - setuptools==80.9.0
      - tensorboard==2.15.2
      - timm==0.9.16
      - tokenizers==0.15.2
      - torchdata==0.10.0
      - transformers==4.38.2
      - vendi-score==0.0.3
      - wandb==0.13.5
