# CANDI's exact torch 2.3.0 pin does not provide a CUDA 12.4 Conda pairing;
# the CUDA 12.4 PyTorch baseline is used and its FA 2.6.1 build stays separate.
# SciPy 1.16 requires newer NumPy, so the compatible stable 1.11.4 is used.
name: dlb-candi
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.11
  - pip=24.2
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4
  - pip:
      - datasets==2.19.0
      - einops==0.8.1
      - evaluate==0.4.2
      - fsspec==2024.2.0
      - huggingface_hub==0.34.4
      - hydra-core==1.3.2
      - lightning==2.5.5
      - numpy==1.24.3
      - omegaconf==2.3.0
      - rich==14.2.0
      - scipy==1.11.4
      - tokenizers==0.22.1
      - torchmetrics==1.8.2
      - tqdm==4.66.4
      - transformers==4.56.1
