# RDLM requires Python 3.9 and PyTorch 2.3.1.  That PyTorch release ships the
# CUDA 12.1 runtime; an NVIDIA 12.4 driver remains backward compatible.
name: dlb-rdlm
channels: [pytorch, nvidia, conda-forge]
dependencies:
  - python=3.9
  - pip=24.2
  - pytorch=2.3.1
  - mkl<2024.1
  - pytorch-cuda=12.1
  - pip:
      - accelerate==1.2.1
      - datasets==3.2.0
      - einops==0.8.0
      - fsspec==2024.9.0
      - hydra-core==1.3.2
      - hydra-joblib-launcher==1.2.0
      - numpy==1.26.4
      - omegaconf==2.3.0
      - pydantic==2.12.4
      - pyyaml==6.0.2
      - scipy==1.13.1
      - tokenizers==0.21.0
      - tqdm==4.67.1
      - transformers==4.47.1
      - wandb==0.19.1
