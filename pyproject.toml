[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffusion-language-baselines"
version = "0.1.0"
description = "Reproducible diffusion language model baseline experiments"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.0",
    "pytest>=8.0",
]
data = [
    "datasets==3.6.0",
    "huggingface_hub>=0.33,<1",
    "pyarrow>=20,<22",
    "transformers>=4.53,<5",
]
checkpoints = [
    "gdown>=6,<7",
    "huggingface_hub>=0.33,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:co_lnotab is deprecated, use co_lines instead.:DeprecationWarning:datasets.utils._dill",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dlb"]
