  - {model: duo_dcd, dataset: owt, resource: duo_dcd_owt_hf}
  - {model: mdlm, dataset: lm1b, resource: flm_lm1b_reproductions, path: lm1b_MDLM_.ckpt, teacher_family: masked_mdlm}
  - {model: mdlm, dataset: owt, resource: mdlm_owt_hf}
  - {model: candi, dataset: lm1b, resource: flm_lm1b_reproductions, path: lm1b_CANDI.ckpt, teacher_family: hybrid_candi}
  - {model: rdlm, dataset: lm1b, resource: rdlm_lm1b_drive}
  - {model: mdlm_sdtt, dataset: owt, resource: sdtt_owt_hf}
  - {model: mdlm_di4c, dataset: owt, resource: di4c_mdlm_owt_zenodo}
