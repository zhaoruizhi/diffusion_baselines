recipes:
  candi_owt:
    model: candi
    dataset: owt
    provenance: reference_reproduction
    teacher_family: hybrid_candi
    source: candi
    source_commit: cd57ae9eec98d6ac71cd52bdc50eeec8dfd70f91
    command: >-
      bash scripts/train/candi.sh --source upstreams/candi --dataset owt
      --output checkpoints/reference_reproduction/candi/owt
    output: checkpoints/reference_reproduction/candi/owt
    note: Explicit prerequisite for the project-owned Task 12 wrapper; the upstream site-specific Slurm job is not invoked directly.
  duo_dcd_lm1b:
    model: duo_dcd
    dataset: lm1b
    provenance: reference_reproduction
    teacher_family: uniform_duo
    source: duo
    source_commit: 7c9b498f5b717de064d6fad7e2509c866e6cb620
    command: >-
      bash scripts/distill/duo_dcd.sh --source upstreams/duo --dataset lm1b
      --teacher checkpoints/reference_reproduction/flm_baselines/lm1b/lm1b_Duo.ckpt
      --output checkpoints/reference_reproduction/duo_dcd/lm1b
      --rounds 8 --steps-per-round 10000 --global-batch-size 128
      --learning-rate 6e-5
    output: checkpoints/reference_reproduction/duo_dcd/lm1b
    prerequisites: [flm_lm1b_reproductions]
    note: Explicit prerequisite for the project-owned Task 12 wrapper; do not substitute the OWT distilled snapshot or alter the reference schedule.
  duo_di4c_lm1b:
    model: duo_di4c
    dataset: lm1b
    provenance: reference_reproduction
    teacher_family: uniform_duo
    source: di4c
    source_commit: ac61ff9fe8e85120f9e1d2a8c5a332f8b8353dd3
    teacher_adapter: uniform_to_absorbing
    command: >-
      bash scripts/distill/di4c.sh --model duo_di4c --dataset lm1b
      --teacher-family uniform_duo
      --teacher-checkpoint checkpoints/reference_reproduction/flm_baselines/lm1b/lm1b_Duo.ckpt
      --output checkpoints/reference_reproduction/duo_di4c/lm1b
      --upstream-override is_di4c=true
    output: checkpoints/reference_reproduction/duo_di4c/lm1b
    prerequisites: [flm_lm1b_reproductions]
    note: Task 12's repository wrapper must adapt the uniform Duo vocabulary/head to the absorbing Di4C shape; Zenodo SDTT files are forbidden substitutes.
  duo_di4c_owt:
    model: duo_di4c
    dataset: owt
    provenance: reference_reproduction
    teacher_family: uniform_duo
    source: di4c
    source_commit: ac61ff9fe8e85120f9e1d2a8c5a332f8b8353dd3
    teacher_adapter: uniform_to_absorbing
    command: >-
      bash scripts/distill/di4c.sh --model duo_di4c --dataset owt
      --teacher-family uniform_duo
      --teacher-checkpoint checkpoints/official/duo/raw_owt/duo.ckpt
      --output checkpoints/reference_reproduction/duo_di4c/owt
      --upstream-override is_di4c=true
    output: checkpoints/reference_reproduction/duo_di4c/owt
    prerequisites: [duo_raw_owt_drive]
    note: Task 12's repository wrapper must adapt the uniform Duo vocabulary/head to the absorbing Di4C shape; never relabel the masked-teacher Zenodo checkpoint.
  mdlm_sdtt_lm1b:
    model: mdlm_sdtt
    dataset: lm1b
    provenance: reference_reproduction
    teacher_family: masked_mdlm
    source: sdtt
    source_commit: 1150985e90b8f2d5749e4469d5154eff9ec922c4
    teacher_adapter: masked_to_absorbing
    command: >-
      bash scripts/distill/mdlm_sdtt.sh --model mdlm_sdtt --dataset lm1b
      --teacher-family masked_mdlm
      --teacher-checkpoint checkpoints/reference_reproduction/flm_baselines/lm1b/lm1b_MDLM_.ckpt
      --output checkpoints/reference_reproduction/mdlm_sdtt/lm1b
    output: checkpoints/reference_reproduction/mdlm_sdtt/lm1b
    prerequisites: [flm_lm1b_reproductions]
    note: Task 12's repository wrapper must adapt the BERT masked teacher to the absorbing SDTT shape; the upstream loader is not shape-compatible directly.
  mdlm_di4c_lm1b:
    model: mdlm_di4c
    dataset: lm1b
    provenance: reference_reproduction
    teacher_family: masked_mdlm
    source: di4c
    source_commit: ac61ff9fe8e85120f9e1d2a8c5a332f8b8353dd3
    teacher_adapter: masked_to_absorbing
    command: >-
      bash scripts/distill/di4c.sh --model mdlm_di4c --dataset lm1b
      --teacher-family masked_mdlm
      --teacher-checkpoint checkpoints/reference_reproduction/flm_baselines/lm1b/lm1b_MDLM_.ckpt
      --output checkpoints/reference_reproduction/mdlm_di4c/lm1b
      --upstream-override is_di4c=true
    output: checkpoints/reference_reproduction/mdlm_di4c/lm1b
    prerequisites: [flm_lm1b_reproductions]
    note: Task 12's repository wrapper must adapt the BERT masked teacher to the absorbing Di4C shape; Zenodo contains OWT students only.
